lass="terminal-2417358551-r2" clip-path="url(#terminal-2417358551-line-15)" textLength="12.2">(</text><text x="854" y="386" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-15)" textLength="73.2">can be</text><text x="0" y="410.4" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-16)" textLength="524.6">used with --dry-run</text><text x="524.6" y="410.4" class="terminal-2417358551-r2" clip-path="url(#terminal-2417358551-line-16)" textLength="12.2">)</text><text x="536.8" y="410.4" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-16)" textLength="12.2">.</text><text x="0" y="434.8" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-17)" textLength="805.2">-s, --signoff Deprecated, use `cz commit -- -s` instead.</text><text x="0" y="459.2" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-18)" textLength="939.4">-a, --all Automatically stage files that have been modified and</text><text x="0" y="483.6" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-19)" textLength="951.6">deleted, but new files you have not told Git about are</text><text x="0" y="508" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-20)" textLength="451.4">not affected.</text><text x="0" y="532.4" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-21)" textLength="805.2">-e, --edit Edit the commit message before committing.</text><text x="0" y="556.8" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-22)" textLength="854">-l MESSAGE_LENGTH_LIMIT, --message-length-limit MESSAGE_LENGTH_LIMIT</text><text x="0" y="581.2" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-23)" textLength="829.6">Set the length limit of the commit message;</text><text x="829.6" y="581.2" class="terminal-2417358551-r3" clip-path="url(#terminal-2417358551-line-23)" textLength="12.2">0</text><text x="841.8" y="581.2" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-23)" textLength="85.4">for no</text><text x="0" y="605.6" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-24)" textLength="366">limit.</text><text x="0" y="630" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-25)" textLength="671">-- Positional arguments separator</text><text x="671" y="630" class="terminal-2417358551-r2" clip-path="url(#terminal-2417358551-line-25)" textLength="12.2">(</text><text x="683.2" y="630" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-25)" textLength="134.2">recommended</text><text x="817.4" y="630" class="terminal-2417358551-r2" clip-path="url(#terminal-2417358551-line-25)" textLength="12.2">)</text><text x="829.6" y="630" class="terminal-2417358551-r1" clip-path="url(#terminal-2417358551-line-25)" textLength="12.2">.</text></g></g></svg>