 --tag | --patch | --next</text><text x="0" y="93.2" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-3)" textLength="12.2">[</text><text x="12.2" y="93.2" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-3)" textLength="12.2">{</text><text x="24.4" y="93.2" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-3)" textLength="463.6">USE_GIT_COMMITS,NONE,PATCH,MINOR,MAJOR</text><text x="488" y="93.2" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-3)" textLength="12.2">}</text><text x="500.2" y="93.2" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-3)" textLength="12.2">]</text><text x="512.4" y="93.2" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-3)" textLength="12.2">]</text><text x="219.6" y="117.6" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-4)" textLength="12.2">[</text><text x="231.8" y="117.6" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-4)" textLength="170.8">MANUAL_VERSION</text><text x="402.6" y="117.6" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-4)" textLength="12.2">]</text><text x="0" y="166.4" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-6)" textLength="817.4">Get the version of the installed commitizen or the current project</text><text x="817.4" y="166.4" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-6)" textLength="12.2">(</text><text x="829.6" y="166.4" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-6)" textLength="97.6">default:</text><text x="0" y="190.8" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-7)" textLength="244">installed commitizen</text><text x="244" y="190.8" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-7)" textLength="12.2">)</text><text x="0" y="239.6" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-9)" textLength="256.2">positional arguments:</text><text x="0" y="264" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-10)" textLength="927.2">MANUAL_VERSION Use the version provided instead of the version from</text><text x="0" y="288.4" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-11)" textLength="939.4">the project. Can be used to test the selected version</text><text x="0" y="312.8" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-12)" textLength="378.2">scheme.</text><text x="0" y="361.6" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-14)" textLength="97.6">options:</text><text x="0" y="386" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-15)" textLength="671">-h, --help show this help message and exit</text><text x="0" y="410.4" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-16)" textLength="890.6">-r, --report Output the system information for reporting bugs.</text><text x="0" y="434.8" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-17)" textLength="805.2">-p, --project Output the version of the current project.</text><text x="0" y="459.2" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-18)" textLength="866.2">-c, --commitizen Output the version of the installed commitizen.</text><text x="0" y="483.6" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-19)" textLength="915">-v, --verbose Output the version of both the installed commitizen</text><text x="0" y="508" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-20)" textLength="585.6">and the current project.</text><text x="0" y="532.4" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-21)" textLength="878.4">--major Output just the major version. Must be used with</text><text x="0" y="556.8" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-22)" textLength="780.8">MANUAL_VERSION, --project, or --verbose.</text><text x="0" y="581.2" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-23)" textLength="878.4">--minor Output just the minor version. Must be used with</text><text x="0" y="605.6" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-24)" textLength="780.8">MANUAL_VERSION, --project, or --verbose.</text><text x="0" y="630" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-25)" textLength="939.4">--tag get the version with tag prefix. Need to be used with</text><text x="0" y="654.4" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-26)" textLength="573.4">--project or --verbose.</text><text x="0" y="678.8" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-27)" textLength="878.4">--patch Output the patch version only. Must be used with</text><text x="0" y="703.2" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-28)" textLength="780.8">MANUAL_VERSION, --project, or --verbose.</text><text x="0" y="727.6" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-29)" textLength="109.8">--next</text><text x="109.8" y="727.6" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-29)" textLength="12.2">[</text><text x="122" y="727.6" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-29)" textLength="12.2">{</text><text x="134.2" y="727.6" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-29)" textLength="463.6">USE_GIT_COMMITS,NONE,PATCH,MINOR,MAJOR</text><text x="597.8" y="727.6" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-29)" textLength="12.2">}</text><text x="610" y="727.6" class="terminal-771281136-r2" clip-path="url(#terminal-771281136-line-29)" textLength="12.2">]</text><text x="0" y="752" class="terminal-771281136-r1" clip-path="url(#terminal-771281136-line-30)" textLength="585.6">Output the next version.</text></g></g></svg>