 id="terminal-3704235523-line-27"><rect width="976" height="24.65" x="0" y="660.3"/></clipPath><clipPath id="terminal-3704235523-line-28"><rect width="976" height="24.65" x="0" y="684.7"/></clipPath><clipPath id="terminal-3704235523-line-29"><rect width="976" height="24.65" x="0" y="709.1"/></clipPath><clipPath id="terminal-3704235523-line-30"><rect width="976" height="24.65" x="0" y="733.5"/></clipPath></defs><rect width="992" height="828.8" x="1" y="1" fill="#292929" stroke="rgba(255,255,255,0.35)" stroke-width="1" rx="8"/><g transform="translate(26,22)"><circle cx="0" cy="0" r="7" fill="#ff5f57"/><circle cx="22" cy="0" r="7" fill="#febc2e"/><circle cx="44" cy="0" r="7" fill="#28c840"/></g><g clip-path="url(#terminal-3704235523-clip-terminal)" transform="translate(9, 41)"><g class="terminal-3704235523-matrix"><text x="0" y="20" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-0)" textLength="207.4">$ cz check --help</text><text x="0" y="44.4" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-1)" textLength="195.2">usage: cz check</text><text x="195.2" y="44.4" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-1)" textLength="12.2">[</text><text x="207.4" y="44.4" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-1)" textLength="24.4">-h</text><text x="231.8" y="44.4" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-1)" textLength="12.2">]</text><text x="195.2" y="68.8" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-2)" textLength="12.2">[</text><text x="207.4" y="68.8" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-2)" textLength="768.6">--commit-msg-file COMMIT_MSG_FILE | --rev-range REV_RANGE | -d</text><text x="0" y="93.2" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-3)" textLength="146.4">| -m MESSAGE</text><text x="146.4" y="93.2" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-3)" textLength="12.2">]</text><text x="195.2" y="117.6" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-4)" textLength="12.2">[</text><text x="207.4" y="117.6" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-4)" textLength="158.6">--allow-abort</text><text x="366" y="117.6" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-4)" textLength="12.2">]</text><text x="390.4" y="117.6" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-4)" textLength="12.2">[</text><text x="402.6" y="117.6" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-4)" textLength="231.8">--allowed-prefixes</text><text x="634.4" y="117.6" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-4)" textLength="12.2">[</text><text x="646.6" y="117.6" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-4)" textLength="207.4">ALLOWED_PREFIXES</text><text x="854" y="117.6" class="terminal-3704235523-r3" clip-path="url(#terminal-3704235523-line-4)" textLength="36.6">...</text><text x="890.6" y="117.6" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-4)" textLength="12.2">]</text><text x="902.8" y="117.6" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-4)" textLength="12.2">]</text><text x="195.2" y="142" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-5)" textLength="12.2">[</text><text x="207.4" y="142" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-5)" textLength="280.6">-l MESSAGE_LENGTH_LIMIT</text><text x="488" y="142" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-5)" textLength="12.2">]</text><text x="0" y="190.8" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-7)" textLength="732">Validate that a commit message matches the commitizen schema</text><text x="0" y="239.6" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-9)" textLength="97.6">options:</text><text x="0" y="264" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-10)" textLength="671">-h, --help show this help message and exit</text><text x="0" y="288.4" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-11)" textLength="427">--commit-msg-file COMMIT_MSG_FILE</text><text x="0" y="312.8" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-12)" textLength="927.2">Ask for the name of the temporary file that contains</text><text x="0" y="337.2" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-13)" textLength="878.4">the commit message. Use it in a git hook script:</text><text x="292.8" y="361.6" class="terminal-3704235523-r3" clip-path="url(#terminal-3704235523-line-14)" textLength="97.6">MSG_FILE</text><text x="390.4" y="361.6" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-14)" textLength="24.4">=$</text><text x="414.8" y="361.6" class="terminal-3704235523-r4" clip-path="url(#terminal-3704235523-line-14)" textLength="12.2">1</text><text x="427" y="361.6" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-14)" textLength="12.2">.</text><text x="0" y="386" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-15)" textLength="280.6">--rev-range REV_RANGE</text><text x="0" y="410.4" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-16)" textLength="915">Validate the commits in the given range of git rev,</text><text x="0" y="434.8" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-17)" textLength="524.6">e.g., master..HEAD.</text><text x="0" y="459.2" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-18)" textLength="305">-d, --use-default-range</text><text x="0" y="483.6" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-19)" textLength="939.4">Validate the commits from the default branch to HEAD,</text><text x="0" y="508" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-20)" textLength="768.6">e.g., refs/remotes/origin/master..HEAD.</text><text x="0" y="532.4" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-21)" textLength="378.2">-m MESSAGE, --message MESSAGE</text><text x="0" y="556.8" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-22)" textLength="707.6">Validate the given commit message.</text><text x="0" y="581.2" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-23)" textLength="927.2">--allow-abort Allow empty commit messages, which typically abort a</text><text x="0" y="605.6" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-24)" textLength="378.2">commit.</text><text x="0" y="630" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-25)" textLength="256.2">--allowed-prefixes</text><text x="256.2" y="630" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-25)" textLength="12.2">[</text><text x="268.4" y="630" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-25)" textLength="207.4">ALLOWED_PREFIXES</text><text x="475.8" y="630" class="terminal-3704235523-r3" clip-path="url(#terminal-3704235523-line-25)" textLength="36.6">...</text><text x="512.4" y="630" class="terminal-3704235523-r2" clip-path="url(#terminal-3704235523-line-25)" textLength="12.2">]</text><text x="0" y="654.4" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-26)" textLength="915">Skip validation for commit messages that start with</text><text x="0" y="678.8" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-27)" textLength="573.4">the specified prefixes.</text><text x="0" y="703.2" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-28)" textLength="854">-l MESSAGE_LENGTH_LIMIT, --message-length-limit MESSAGE_LENGTH_LIMIT</text><text x="0" y="727.6" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-29)" textLength="878.4">Restrict the length of the **first line** of the</text><text x="0" y="752" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-30)" textLength="488">commit message;</text><text x="488" y="752" class="terminal-3704235523-r4" clip-path="url(#terminal-3704235523-line-30)" textLength="12.2">0</text><text x="500.2" y="752" class="terminal-3704235523-r1" clip-path="url(#terminal-3704235523-line-30)" textLength="170.8">for no limit.</text></g></g></svg>